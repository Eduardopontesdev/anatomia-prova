<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sistema Muscular Ilustrado – Anatomia e Fisiologia</title>
<style>
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --brand: #0f766e;
  --brand2: #14b8a6;
  --brand-soft: #ccfbf1;
  --ok: #059669;
  --ok-soft: #d1fae5;
  --err: #e11d48;
  --err-soft: #ffe4e6;
  --warn: #d97706;
  --warn-soft: #fef3c7;
  --accent: #2563eb;
  --accent-soft: #dbeafe;
  --violet: #7c3aed;
  --violet-soft: #ede9fe;
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 4px 14px rgba(15, 23, 42, 0.05);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1220;
    --card: #131c2e;
    --text: #e5edf7;
    --muted: #94a3b8;
    --line: #243049;
    --brand: #14b8a6;
    --brand2: #2dd4bf;
    --brand-soft: #0f2f2c;
    --ok: #34d399;
    --ok-soft: #08302a;
    --err: #fb7185;
    --err-soft: #3a1420;
    --warn: #fbbf24;
    --warn-soft: #3a2a0a;
    --accent: #60a5fa;
    --accent-soft: #13243f;
    --violet: #a78bfa;
    --violet-soft: #251c45;
    --shadow: none;
  }
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  height: 100%;
}

body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  overscroll-behavior: none;
}

button, input {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: none;
}

.hidden {
  display: none !important;
}

#app {
  max-width: 740px;
  margin: 0 auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

.top {
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 16px;
  background: linear-gradient(135deg, #0f766e, #115e59 60%, #134e4a);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-radius: 0 0 22px 22px;
  box-shadow: 0 6px 20px rgba(15, 118, 110, 0.25);
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 11px;
  text-align: left;
}

.logo .ic {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.16);
  display: grid;
  place-items: center;
  font-size: 22px;
  flex-shrink: 0;
}

.logo h1 {
  font-size: 17px;
  margin: 0;
  font-weight: 800;
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.logo p {
  margin: 2px 0 0;
  font-size: 12px;
  opacity: 0.88;
}

.chip {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 999px;
  padding: 6px 12px;
  font-weight: 700;
  font-size: 12.5px;
  white-space: nowrap;
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 28px;
  -webkit-overflow-scrolling: touch;
}

.view {
  animation: fadeIn 0.22s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--card);
  border-top: 1px solid var(--line);
  padding: 6px 8px calc(env(safe-area-inset-bottom, 0px) + 8px);
  flex-shrink: 0;
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 7px 4px;
  border-radius: 14px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 700;
}

.tab .e {
  font-size: 21px;
  line-height: 1.1;
}

.tab.on {
  color: var(--brand);
  background: var(--brand-soft);
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}

.card-title {
  display: block;
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 4px;
}

h2.sec {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 16px 4px 8px;
  font-weight: 800;
}

h2.sec:first-child {
  margin-top: 4px;
}

.hint {
  font-size: 13px;
  color: var(--muted);
  margin: 4px 0 10px;
}

.backbtn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 99px;
  background: var(--card);
  border: 1px solid var(--line);
  font-weight: 800;
  font-size: 13.5px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

.seg {
  display: flex;
  gap: 6px;
  background: var(--bg);
  padding: 4px;
  border-radius: 14px;
  border: 1px solid var(--line);
  flex-wrap: wrap;
}

.seg button {
  flex: 1;
  min-width: 86px;
  padding: 9px 6px;
  border-radius: 11px;
  font-weight: 700;
  font-size: 12.5px;
  color: var(--muted);
}

.seg button.on {
  background: var(--card);
  color: var(--brand);
  box-shadow: var(--shadow);
}

.chips {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 6px;
  scrollbar-width: none;
}

.chips::-webkit-scrollbar {
  display: none;
}

.chips button {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 99px;
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}

.chips button.on {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.topics {
  display: grid;
  gap: 11px;
}

.topic {
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 14px;
  box-shadow: var(--shadow);
  width: 100%;
}

.topic:active {
  transform: scale(0.985);
}

.topic .te {
  width: 54px;
  height: 54px;
  border-radius: 17px;
  display: grid;
  place-items: center;
  font-size: 27px;
  flex-shrink: 0;
}

.topic b {
  display: block;
  font-size: 15.5px;
}

.topic small {
  display: block;
  color: var(--muted);
  font-size: 12.5px;
  margin-top: 2px;
  line-height: 1.35;
}

.topic .go {
  margin-left: auto;
  font-size: 22px;
  color: var(--muted);
}

.topic.t-train {
  background: linear-gradient(135deg, #7c3aed, #2563eb);
  border: 0;
  color: #fff;
}

.topic.t-train small,
.topic.t-train .go {
  color: rgba(255, 255, 255, 0.9);
}

.topic.t-train .te {
  background: rgba(255, 255, 255, 0.2);
}

.btn {
  width: 100%;
  padding: 13px 14px;
  border-radius: 14px;
  font-weight: 800;
  font-size: 14.5px;
  background: var(--brand);
  color: #fff;
  margin-top: 10px;
  box-shadow: 0 4px 12px rgba(15, 118, 110, 0.22);
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn:active {
  transform: scale(0.985);
}

.btn.dark {
  background: var(--text);
  color: var(--bg);
  box-shadow: none;
}

.btn.soft {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
  box-shadow: none;
}

.btn.vio {
  background: linear-gradient(135deg, #7c3aed, #2563eb);
}

.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.two2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

@media (max-width: 480px) {
  .two2 {
    grid-template-columns: 1fr;
  }
}

.search-wrap {
  position: relative;
  margin-bottom: 12px;
}

.search-in {
  width: 100%;
  padding: 12px 38px 12px 14px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--bg);
  color: var(--text);
  font-size: 14.5px;
  outline: none;
}

.search-in:focus {
  border-color: var(--brand);
  background: var(--card);
}

.search-clr {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--card);
  color: var(--muted);
  font-size: 13px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
}

.atlas-frame {
  position: relative;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  margin-top: 8px;
}

.atlas-frame img.atlas-img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 280px;
  object-fit: contain;
  background: #f8fafc;
}

@media (prefers-color-scheme: dark) {
  .atlas-frame img.atlas-img {
    background: #0f172a;
  }
}

.atlas-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 11px;
  background: var(--card);
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--muted);
}

.sync-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}

.sync-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.sync-status {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 8px;
  line-height: 1.4;
}

.anat-card {
  background: linear-gradient(145deg, var(--bg), var(--card));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  margin-top: 8px;
}

.anat-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}

.anat-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand);
  font-size: 11.5px;
  font-weight: 800;
}

.anat-sub {
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
}

.meter-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 10px 0 0;
}

@media (max-width: 480px) {
  .meter-grid {
    grid-template-columns: 1fr;
  }
}

.meter-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 9px 10px;
}

.meter-box small {
  display: block;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  font-weight: 800;
}

.meter-box b {
  display: block;
  font-size: 13px;
  margin-top: 2px;
}

.mbar {
  height: 7px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
  margin-top: 6px;
}

.mbar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand), var(--brand2));
}

.region-map {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-top: 10px;
}

.rmap-btn {
  text-align: left;
  padding: 10px 11px;
  border-radius: 14px;
  background: var(--card);
  border: 2px solid var(--line);
}

.rmap-btn b {
  display: block;
  font-size: 13px;
  margin-bottom: 2px;
}

.rmap-btn span {
  display: block;
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.3;
}

.rmap-btn.on {
  border-color: var(--brand);
  background: var(--brand-soft);
}

.rmap-btn.on b {
  color: var(--brand);
}

.sbox {
  background: var(--brand-soft);
  border-radius: 14px;
  padding: 11px 13px;
  font-size: 13.5px;
  margin-top: 10px;
  line-height: 1.45;
}

.sbox b {
  color: var(--brand);
}

.mini2 {
  border-radius: 14px;
  padding: 11px 12px;
  font-size: 13px;
  border: 1px solid var(--line);
  background: var(--bg);
}

.mini2 b {
  display: block;
  font-size: 14px;
  margin-bottom: 3px;
}

.tscroll {
  overflow-x: auto;
  margin-top: 6px;
  -webkit-overflow-scrolling: touch;
}

table.tb {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}

table.tb th,
table.tb td {
  text-align: left;
  padding: 8px 7px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
  line-height: 1.35;
}

table.tb th {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  background: var(--bg);
}

table.tb tr.hl-row {
  background: var(--brand-soft);
}

table.tb td:first-child {
  font-weight: 800;
  color: var(--text);
  min-width: 120px;
}

.mgrid {
  display: grid;
  gap: 8px;
  margin-top: 8px;
}

.mitem {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 11px 12px;
}

.mitem-h {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  font-weight: 800;
  font-size: 14px;
}

.mitem-tag {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--card);
  color: var(--brand);
  border: 1px solid var(--line);
  white-space: nowrap;
}

.mitem-b {
  font-size: 13px;
  margin-top: 5px;
}

.mitem-meta {
  display: grid;
  gap: 3px;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--line);
  font-size: 12.5px;
}

.mitem-meta span b {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
}

.mnem {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 10px 0 4px;
}

.mnem span {
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 700;
}

.mnem span b {
  color: var(--brand);
  font-size: 17px;
}

/* Player Passo a Passo */
.player {
  margin-top: 10px;
}

.stitle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 800;
  font-size: 14px;
  margin-bottom: 8px;
}

.stitle span:last-child {
  color: var(--muted);
  font-size: 12px;
}

.screen {
  background: linear-gradient(180deg, var(--brand-soft), var(--card));
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 14px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.scene {
  animation: fadeIn 0.3s ease-out;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cap {
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  padding: 4px;
  line-height: 1.45;
}

.segs {
  display: flex;
  gap: 4px;
  margin: 12px 0 8px;
}

.segs button {
  flex: 1;
  height: 8px;
  border-radius: 9px;
  background: var(--line);
  position: relative;
  overflow: hidden;
  padding: 0;
}

.segs button i {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0;
  background: var(--brand2);
}

.segs button.done i {
  width: 100%;
}

.segs button.cur i {
  animation: fillseg var(--d, 6s) linear forwards;
}

@keyframes fillseg {
  to { width: 100%; }
}

.paused .segs button.cur i {
  animation-play-state: paused !important;
}

.ctrl {
  display: flex;
  gap: 10px;
  justify-content: center;
  align-items: center;
}

.cb {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 17px;
  box-shadow: var(--shadow);
}

.cb.big {
  width: 54px;
  height: 54px;
  background: var(--brand);
  color: #fff;
  font-size: 20px;
  border: 0;
}

.cb.sp {
  font-size: 12.5px;
  font-weight: 800;
  width: 52px;
  border-radius: 22px;
}

/* Jogo de Ordenacao */
.ord-list {
  display: grid;
  gap: 7px;
  margin-top: 8px;
}

.ord-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 13px;
  background: var(--bg);
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 700;
}

.ord-item.ok {
  border-color: var(--ok);
  background: var(--ok-soft);
}

.ord-item.bad {
  border-color: var(--err);
  background: var(--err-soft);
}

.ord-btns {
  display: flex;
  gap: 4px;
}

.ord-btns button {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--card);
  border: 1px solid var(--line);
  font-weight: 800;
}

/* Quiz & Identificacao */
.qhead {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.x {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  font-size: 18px;
  flex-shrink: 0;
}

.prog {
  flex: 1;
}

.prog .bar {
  height: 10px;
  border-radius: 99px;
  background: var(--line);
  overflow: hidden;
}

.prog .bar i {
  display: block;
  height: 100%;
  background: var(--brand2);
  border-radius: 99px;
  transition: width 0.3s;
}

.qmeta {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
  margin-bottom: 5px;
}

.pill {
  display: inline-block;
  background: var(--brand-soft);
  color: var(--brand);
  font-weight: 800;
  font-size: 12px;
  padding: 4px 11px;
  border-radius: 99px;
  margin-bottom: 10px;
}

.qtext {
  font-size: 16.5px;
  font-weight: 800;
  margin: 4px 0 14px;
  line-height: 1.4;
}

.opts {
  display: grid;
  gap: 9px;
}

.opt {
  display: flex;
  gap: 11px;
  align-items: center;
  text-align: left;
  padding: 12px 13px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--card);
  font-weight: 600;
  font-size: 14px;
}

.opt .lt {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: var(--bg);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 13px;
  color: var(--muted);
  flex-shrink: 0;
}

.opt.ok {
  border-color: var(--ok);
  background: var(--ok-soft);
}

.opt.ok .lt {
  background: var(--ok);
  color: #fff;
}

.opt.bad {
  border-color: var(--err);
  background: var(--err-soft);
}

.opt.bad .lt {
  background: var(--err);
  color: #fff;
}

.in {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--bg);
  font-size: 15.5px;
  font-weight: 700;
  outline: none;

    let cachedMediaMap = {};
    let syncState = { running: false, done: 0, total: SCENE_KEYS.length, saved: 0, msg: "" };

    function loadMediaCache() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") cachedMediaMap = parsed;
        }
      } catch (e) {
        cachedMediaMap = {};
      }
      syncState.saved = Object.keys(cachedMediaMap).length;
    }

    function saveMediaCache() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cachedMediaMap));
      } catch (e) {
        syncState.msg = "Limite de armazenamento local atingido; algumas imagens não foram salvas.";
      }
      syncState.saved = Object.keys(cachedMediaMap).length;
    }

    function clearMediaCache() {
      cachedMediaMap = {};
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      syncState.saved = 0;
      syncState.done = 0;
      syncState.msg = "Cache offline de imagens limpo.";
    }

    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(typeof reader.result === "string" ? reader.result : "");
        reader.onerror = () => reject(new Error("Falha ao converter imagem para base64"));
        reader.readAsDataURL(blob);
      });
    }

    async function fetchWikimediaSceneImage(sceneKey) {
      const q = WIKIMEDIA_QUERIES[sceneKey] || "human muscle anatomy";
      const apiUrl =
        "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*" +
        "&generator=search&gsrnamespace=6&gsrlimit=4&gsrsearch=" +
        encodeURIComponent(q + " filetype:bitmap") +
        "&prop=imageinfo&iiprop=url|mime&iiurlwidth=640";

      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const pages = data && data.query && data.query.pages ? Object.values(data.query.pages) : [];

      for (let i = 0; i < pages.length; i++) {
        const info = pages[i] && pages[i].imageinfo && pages[i].imageinfo[0];
        const imgUrl = (info && (info.thumburl || info.url)) || "";
        const mime = (info && info.mime) || "";
        if (!imgUrl || (mime && mime.indexOf("svg") !== -1 && !info.thumburl)) continue;

        try {
          const imgRes = await fetch(imgUrl);
          if (!imgRes.ok) continue;
          const blob = await imgRes.blob();
          if (!blob || blob.size === 0 || blob.size > 900000) continue;
          const dataUrl = await blobToDataURL(blob);
          if (dataUrl && dataUrl.indexOf("data:image/") === 0) {
            return { dataUrl, title: pages[i].title || q };
          }
        } catch (e) {
          // tenta próximo resultado da busca
        }
      }
      throw new Error("Sem imagem compatível");
    }

    async function syncAllWikimediaImages(onProgress) {
      if (syncState.running) return;
      syncState.running = true;
      syncState.done = 0;
      syncState.total = SCENE_KEYS.length;
      syncState.msg = "Consultando API pública do Wikimedia Commons...";
      if (onProgress) onProgress();

      let okCount = 0;
      for (let i = 0; i < SCENE_KEYS.length; i++) {
        const key = SCENE_KEYS[i];
        try {
          const found = await fetchWikimediaSceneImage(key);
          cachedMediaMap[key] = {
            src: found.dataUrl,
            label: found.title.replace(/^File:/i, ""),
            updatedAt: new Date().toISOString().slice(0, 10)
          };
          saveMediaCache();
          okCount++;
        } catch (e) {
          // mantém fallback para cenas sem retorno válido
        }
        syncState.done = i + 1;
        syncState.msg = "Sincronizando " + syncState.done + "/" + syncState.total + " (" + okCount + " baixadas nesta sessão)...";
        if (onProgress) onProgress();
      }

      syncState.running = false;
      syncState.msg = "Concluído: " + syncState.saved + "/" + syncState.total + " pranchas salvas no cache offline.";
      if (onProgress) onProgress();
    }

    function drawRoundBox(ctx, x, y, w, h, r) {
      ctx.beginPath();
      if (typeof ctx.roundRect === "function") {
        ctx.roundRect(x, y, w, h, r);
      } else {
        ctx.rect(x, y, w, h);
      }
    }

    function renderRasterPlate(sceneKey, blindMode) {
      try {
        const W = 640, H = 320;
        const c = document.createElement("canvas");
        c.width = W;
        c.height = H;
        const ctx = c.getContext("2d");
        if (!ctx) return "";

        const bg = ctx.createLinearGradient(0, 0, W, H);
        bg.addColorStop(0, "#f8fafc");
        bg.addColorStop(1, "#e2e8f0");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 2;
        ctx.strokeRect(8, 8, W - 16, H - 16);

        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 15px system-ui, sans-serif";
        ctx.fillText(blindMode ? "IDENTIFICAÇÃO ANATÔMICA" : "PRANCHA DE REFERÊNCIA – " + sceneKey.toUpperCase(), 20, 32);

        ctx.fillStyle = "#475569";
        ctx.font = "12.5px system-ui, sans-serif";
        ctx.fillText(
          blindMode
            ? "Modo sem rótulos • Sincronize na tela inicial para usar fotos do Wikimedia Commons."
            : "Fallback offline ativo • Toque em 'Sincronizar imagens' na tela inicial para baixar via API.",
          20,
          54
        );

        const g = ctx.createLinearGradient(160, 120, 480, 220);
        g.addColorStop(0, "#e11d48");
        g.addColorStop(0.5, "#fb7185");
        g.addColorStop(1, "#9f1239");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(320, 175, 130, 40, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(blindMode ? "ESTRUTURA EM ANÁLISE" : "TECIDO / REGIÃO MUSCULAR", 320, 179);
        ctx.textAlign = "left";

        return c.toDataURL("image/png");
      } catch (err) {
        return "";
      }
    }

    function preloadOfflineImages() {
      SCENE_KEYS.forEach(key => {
        OFFLINE_IMAGE_BANK[key] = renderRasterPlate(key, false);
        OFFLINE_IMAGE_BANK[key + "_blind"] = renderRasterPlate(key, true);
      });
    }

    function resolveImageSource(sceneKey, blindMode) {
      const cached = cachedMediaMap[sceneKey];
      if (cached && cached.src && cached.src.indexOf("data:image/") === 0) {
        return {
          src: cached.src,
          badge: "Wikimedia Commons (Offline)",
          title: cached.label || sceneKey
        };
      }
      const fallback = OFFLINE_IMAGE_BANK[sceneKey + (blindMode ? "_blind" : "")] || renderRasterPlate(sceneKey, Boolean(blindMode));
      return {
        src: fallback,
        localCandidate: "./img/" + sceneKey + ".png",
        badge: blindMode ? "Modo identificação" : "Fallback offline",
        title: sceneKey
      };
    }

    function renderAtlasImage(sceneKey, altText, blindMode) {
      const info = resolveImageSource(sceneKey, blindMode);
      const localAttr = info.localCandidate ? ' data-local-img="' + esc(info.localCandidate) + '"' : "";
      const fallbackAttr = info.src ? ' data-fallback-src="' + esc(info.src) + '"' : "";

      return '<div class="atlas-frame">' +
        '<img class="atlas-img" src="' + info.src + '" alt="' + esc(altText) + '"' + localAttr + fallbackAttr + ' onerror="if(this.dataset.localImg && this.src!==this.dataset.localImg){this.dataset.triedLocal=\'1\';this.src=this.dataset.localImg;}else if(this.dataset.fallbackSrc && this.src!==this.dataset.fallbackSrc){this.src=this.dataset.fallbackSrc;}">' +
        '<div class="atlas-bar">' +
          '<span>🖼️ ' + esc(info.title) + '</span>' +
          '<span>' + esc(info.badge) + '</span>' +
        '</div>' +
      '</div>';
    }

    function renderMuscleTable(list, filterText) {
      const q = normA(filterText || "");
      const rows = q
        ? list.filter(m => normA(m.n + " " + (m.o || "") + " " + (m.i || "") + " " + (m.loc || "") + " " + m.f).indexOf(q) !== -1)
        : list;

      if (!rows.length) {
        return '<p class="hint">Nenhum músculo encontrado para “' + esc(filterText) + '”.</p>';
      }

      const showOI = rows.some(m => m.o || m.i);
      const showLoc = rows.some(m => m.loc);

      return '<div class="tscroll"><table class="tb"><thead><tr>' +
        '<th>Músculo</th>' +
        (showOI ? '<th>Origem</th><th>Inserção</th>' : '') +
        (showLoc ? '<th>Localização</th>' : '') +
        '<th>Ação principal</th>' +
      '</tr></thead><tbody>' +
        rows.map(m => (
          '<tr class="' + (q ? 'hl-row' : '') + '">' +
            '<td>' + esc(m.n) + '</td>' +
            (showOI ? '<td>' + esc(m.o || "—") + '</td><td>' + esc(m.i || "—") + '</td>' : '') +
            (showLoc ? '<td>' + esc(m.loc || "—") + '</td>' : '') +
            '<td>' + esc(m.f) + '</td>' +
          '</tr>'
        )).join("") +
      '</tbody></table></div>';
    }

    /* ==================== PLAYER PASSO A PASSO ==================== */
    const P = { scenes: [], i: 0, playing: false, timer: null, speed: 1, rem: 0, t0: 0 };

    function stopPlayer() {
      clearTimeout(P.timer);
      P.timer = null;
      P.playing = false;
      const pl = $("player");
      if (pl) pl.classList.add("paused");
      const b = $("pplay");
      if (b) b.textContent = "▶";
    }

    function mountPlayer(box, scenes) {
      clearTimeout(P.timer);
      P.scenes = scenes;
      P.i = 0;
      P.playing = true;
      box.innerHTML = '<div class="player" id="player">' +
        '<div class="stitle"><span id="ptitle"></span><span id="pcount"></span></div>' +
        '<div class="screen" id="pscreen"></div>' +
        '<div class="segs" id="psegs"></div>' +
        '<div class="ctrl">' +
          '<button class="cb" id="pprev" type="button" aria-label="Anterior">⏮</button>' +
          '<button class="cb big" id="pplay" type="button" aria-label="Pausar/Reproduzir">⏸</button>' +
          '<button class="cb" id="pnext" type="button" aria-label="Próximo">⏭</button>' +
          '<button class="cb sp" id="pspeed" type="button" aria-label="Velocidade">' + (P.speed === 1 ? "1×" : "0,5×") + '</button>' +
        '</div>' +
      '</div>';

      $("pprev").onclick = () => { P.playing = true; goScene(Math.max(0, P.i - 1)); };
      $("pnext").onclick = () => { P.playing = true; goScene(Math.min(P.scenes.length - 1, P.i + 1)); };
      $("pspeed").onclick = () => {
        P.speed = P.speed === 1 ? 0.5 : 1;
        $("pspeed").textContent = P.speed === 1 ? "1×" : "0,5×";
        P.playing = true;
        goScene(P.i);
      };
      $("pplay").onclick = togglePlay;
      goScene(0);
    }

    function scheduleScene(ms) {
      clearTimeout(P.timer);
      P.rem = ms;
      P.t0 = performance.now();
      P.timer = setTimeout(() => {
        if (P.i < P.scenes.length - 1) {
          goScene(P.i + 1);
        } else {
          P.playing = false;
          $("pplay").textContent = "🔁";
          $("player").classList.add("paused");
        }
      }, ms);
    }

    function goScene(idx) {
      const sc = P.scenes[idx];
      P.i = idx;
      const dur = (sc.d || 6) / P.speed;
      $("pscreen").innerHTML = '<div class="scene">' + sc.vis + '<div class="cap">' + sc.say + '</div></div>';
      $("ptitle").textContent = (idx + 1) + ". " + sc.t;
      $("pcount").textContent = "Passo " + (idx + 1) + " de " + P.scenes.length;
      $("psegs").innerHTML = P.scenes.map((_, k) => (
        '<button type="button" data-i="' + k + '" class="' + (k < idx ? "done" : k === idx ? "cur" : "") + '" style="--d:' + dur + 's"><i></i></button>'
      )).join("");
      $("psegs").querySelectorAll("button").forEach(b => {
        b.onclick = () => { P.playing = true; goScene(+b.dataset.i); };
      });
      const pl = $("player");
      if (P.playing) {
        pl.classList.remove("paused");
        $("pplay").textContent = "⏸";
        scheduleScene(dur * 1000);
      } else {
        clearTimeout(P.timer);
        pl.classList.add("paused");
        $("pplay").textContent = "▶";
      }
    }

    function togglePlay() {
      const pl = $("player");
      if (P.playing) {
        P.playing = false;
        clearTimeout(P.timer);
        P.rem = Math.max(300, P.rem - (performance.now() - P.t0));
        pl.classList.add("paused");
        $("pplay").textContent = "▶";
      } else {
        const atEnd = $("pplay").textContent === "🔁";
        P.playing = true;
        if (atEnd) { goScene(0); return; }
        pl.classList.remove("paused");
        $("pplay").textContent = "⏸";
        scheduleScene(P.rem || 2000);
      }
    }

    /* ==================== TÓPICOS ==================== */
    function openTopic(topicId) {
      showView("topic");
      const builders = {
        prop: [pageProp, bindProp],
        face: [pageFace, bindFace],
        sup: [pageSup, bindSup],
        tor: [pageTor, bindTor],
        abd: [pageAbd, bindAbd],
        pel: [pagePel, bindPel],
        inf: [pageInf, bindInf]
      };

    /* TÓPICO 1: PROPRIEDADES & CONTRAÇÕES + JOGO DE ORDENAÇÃO */
    let propContrMode = "iso";
    let orderDeck = shuffle([
      { id: 1, text: "1. Excitabilidade elétrica: resposta a estímulos gerando potenciais de ação musculares." },
      { id: 2, text: "2. Contratilidade: contração vigorosa ao potencial de ação, gerando tensão e puxando inserções." },
      { id: 3, text: "3. Extensibilidade: extensão com limites sem sofrer lesão, limitada pelo tecido conjuntivo." },
      { id: 4, text: "4. Elasticidade: retorno ao comprimento e forma originais após contração ou alongamento." }
    ]);
    let orderChecked = false;

    function renderOrderList() {
      return '<div class="ord-list">' +
        orderDeck.map((item, idx) => {
          const cls = orderChecked ? (item.id === idx + 1 ? "ok" : "bad") : "";
          return '<div class="ord-item ' + cls + '">' +
            '<span>' + esc(item.text.replace(/^\d+\.\s*/, "")) + '</span>' +
            '<div class="ord-btns">' +
              '<button type="button" data-up="' + idx + '" aria-label="Subir">↑</button>' +
              '<button type="button" data-dn="' + idx + '" aria-label="Descer">↓</button>' +
            '</div>' +
          '</div>';
        }).join("") +
      '</div>';
    }

    function pageProp() {
      return '<div class="card">' +
        '<span class="card-title">⚡ Propriedades do Tecido Muscular</span>' +

        '<div class="two2" style="margin-top:12px">' +
          '<div class="mini2"><b>1. Excitabilidade elétrica</b>Capacidade de responder a estímulos produzindo sinais elétricos chamados <b>potenciais de ação musculares</b>.</div>' +

          '<div class="mini2"><b>4. Elasticidade</b>Capacidade do tecido muscular de <b>retornar ao comprimento e forma originais</b> depois de uma contração ou alongamento.</div>' +

      $("cseg").onclick = e => {

        propContrMode = b.dataset.m;
        $("cseg").querySelectorAll("button").forEach(btn => btn.classList.toggle("on", btn === b));

          { t: "Contratilidade", d: 6, vis: cardProperty("con"), say: "Contrai-se <b>vigorosamente</b> ao potencial de ação, gerando tensão e puxando as inserções." },
          { t: "Extensibilidade", d: 6, vis: cardProperty("ext"), say: "Estende-se com limites <b>sem sofrer lesão</b>; o tecido conjuntivo interno limita o alongamento." },

          { t: "Contração isotônica concêntrica", d: 6.5, vis: cardContraction("conc"), say: "Tensão transpõe a resistência: o <b>músculo encurta</b> e reduz o ângulo na articulação." },

        ]);

      const bindOrderButtons = () => {

            orderChecked = false;

            $("ord-fb").innerHTML = "";

        });
        $("ord-box").querySelectorAll("[data-dn]").forEach(btn => {
          btn.onclick = () => {

            orderDeck[idx + 1] = orderDeck[idx];
            orderDeck[idx] = tmp;
            $("ord-box").innerHTML = renderOrderList();
            $("ord-fb").innerHTML = "";
            bindOrderButtons();
          };

      };
      bindOrderButtons();

      $("ord-chk").onclick = () => {
        orderChecked = true;
        $("ord-box").innerHTML = renderOrderList();

        $("ord-fb").innerHTML = "";

    function startQuiz() {
      let pool = shuffle(qFilter === "all" ? QZ : QZ.filter(q => q.t === qFilter));
      if (qLen > 0) pool = pool.slice(0, qLen);
      QS = { deck: pool, i: 0, ok: 0, bad: 0, done: false, miss: [] };
      renderQ();
    }

    function renderQ() {
      if (QS.i >= QS.deck.length) return renderQResult();
      QS.done = false;
      const q = QS.deck[QS.i];
      const order = shuffle(q.o.map((_, i) => i));
      const T = TOPICS.find(t => t.id === q.t);

      $("v-quiz").innerHTML = '<div class="qhead">' +
        '<button type="button" class="x" id="qx" aria-label="Sair">✕</button>' +
        '<div class="prog">' +
          '<div class="qmeta"><span>Questão ' + (QS.i + 1) + ' de ' + QS.deck.length + '</span><span>✅ ' + QS.ok + ' &nbsp;❌ ' + QS.bad + '</span></div>' +
          '<div class="bar"><i style="width:' + Math.round(QS.i / QS.deck.length * 100) + '%"></i></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<span class="pill">' + T.e + ' ' + esc(T.t) + '</span>' +
        '<div class="qtext">' + esc(q.q) + '</div>' +
        '<div class="opts" id="opts">' +
          order.map((oi, k) => '<button type="button" class="opt" data-k="' + k + '"><span class="lt">' + "ABCDE"[k] + '</span><span>' + esc(q.o[oi]) + '</span></button>').join("") +
        '</div>' +
        '<div id="fb"></div>' +
      '</div>';

      $("qx").onclick = () => askConfirm("Sair do treino?", "Seu progresso nesta rodada será encerrado.", renderQuizHome);

      $("opts").querySelectorAll(".opt").forEach(btn => {
        btn.onclick = () => {
          if (QS.done) return;
          QS.done = true;
          const k = +btn.dataset.k;
          const ok = order[k] === q.a;
          $("opts").querySelectorAll(".opt").forEach((el, idx) => {
            el.disabled = true;
            if (order[idx] === q.a) el.classList.add("ok");
            else if (idx === k) el.classList.add("bad");
          });
          if (ok) QS.ok++;
          else { QS.bad++; QS.miss.push(q); }
          const isLast = QS.i + 1 >= QS.deck.length;
          $("fb").innerHTML = '<div class="fb ' + (ok ? "ok" : "bad") + '">' +
            '<div class="fbh"><span class="fbi">' + (ok ? "✓" : "✕") + '</span><div><small>' + (ok ? "Correto!" : "Resposta correta") + '</small><b>' + esc(q.o[q.a]) + '</b></div></div>' +
            '<div class="tip"><small>Explicação</small>' + q.x + '</div>' +
            '<button type="button" class="btn dark" id="nx">' + (isLast ? "Ver resultado" : "Próxima →") + '</button>' +
          '</div>';
          $("nx").onclick = () => { QS.i++; renderQ(); };
        };
      });
    }

    function renderQResult() {
      const total = QS.ok + QS.bad;
      const acc = total ? Math.round(QS.ok / total * 100) : 0;
      const missIds = Array.from(new Set(QS.miss.map(q => q.t)));
      $("v-quiz").innerHTML = '<div class="card result">' +
        '<div class="trophy">' + (acc >= 85 ? "🏆" : acc >= 65 ? "🎉" : "💪") + '</div>' +
        '<h2>Resultado da Rodada</h2>' +
        '<p>' + (acc >= 70 ? "Excelente domínio do conteúdo!" : "Revise os tópicos abaixo e tente novamente.") + '</p>' +
        '<div class="rs">' +
          '<div style="background:var(--ok-soft);color:var(--ok)"><b>' + QS.ok + '</b><span>Acertos</span></div>' +
          '<div style="background:var(--err-soft);color:var(--err)"><b>' + QS.bad + '</b><span>Erros</span></div>' +
          '<div style="background:var(--bg)"><b>' + acc + '%</b><span>Aproveit.</span></div>' +
        '</div>' +
        (missIds.length ? (
          '<h2 class="sec" style="text-align:center">Tópicos para revisar</h2>' +
          '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">' +
            missIds.map(tid => {
              const T = TOPICS.find(x => x.id === tid);
              return '<button type="button" class="tag" data-t="' + tid + '">' + T.e + ' ' + esc(T.t) + '</button>';
            }).join("") +
          '</div>'
        ) : '') +
        '<button type="button" class="btn" id="again">🔄 Nova rodada</button>' +
        '<button type="button" class="btn soft" id="hm">Voltar aos tópicos</button>' +
      '</div>';

      $("v-quiz").querySelectorAll("[data-t]").forEach(b => {
        b.onclick = () => openTopic(b.dataset.t);
      });
      $("again").onclick = startQuiz;
      $("hm").onclick = renderHome;
    }

    /* MODO 2: IDENTIFICAÇÃO COM IMAGEM */
    function renderIQHome() {
      const cnt = g => g === "all" ? IMG_QUIZ.length : IMG_QUIZ.filter(i => i.g === g).length;
      const total = cnt(iqGroup);
      const count = iqLen && iqLen < total ? iqLen : total;

      $("qsub").innerHTML = '<div class="card">' +
        '<span class="card-title">🖼️ Identificação com Imagem</span>' +
        '<p class="hint">Observe a prancha anatômica, use a dica se precisar e digite a resposta (aceita com ou sem acento e tolera pequenos erros de digitação).</p>' +
        '<h2 class="sec">Tópico</h2>' +
        '<div class="chips">' +
          '<button type="button" data-g="all" class="' + (iqGroup === "all" ? "on" : "") + '">Todos (' + cnt("all") + ')</button>' +
          TOPICS.map(t => '<button type="button" data-g="' + t.id + '" class="' + (iqGroup === t.id ? "on" : "") + '">' + t.e + ' ' + esc(t.s) + ' (' + cnt(t.id) + ')</button>').join("") +
        '</div>' +
        '<h2 class="sec">Quantidade</h2>' +
        '<div class="seg">' +
          [[5, "5"], [10, "10"], [0, "Todas"]].map(p => '<button type="button" data-l="' + p[0] + '" class="' + (iqLen === p[0] ? "on" : "") + '">' + p[1] + '</button>').join("") +
        '</div>' +
        '<button type="button" class="btn" id="igo">▶ Começar (' + count + ' desafios)</button>' +
      '</div>';

      $("qsub").querySelectorAll("[data-g]").forEach(b => {
        b.onclick = () => { iqGroup = b.dataset.g; renderQuizHome(); };
      });
      $("qsub").querySelectorAll("[data-l]").forEach(b => {
        b.onclick = () => { iqLen = +b.dataset.l; renderQuizHome(); };
      });
      $("igo").onclick = startIQ;
    }

    function startIQ() {
      let pool = shuffle(IMG_QUIZ.filter(i => iqGroup === "all" || i.g === iqGroup));
      if (iqLen > 0) pool = pool.slice(0, iqLen);
      IS = { deck: pool, i: 0, ok: 0, bad: 0, miss: [], done: false };
      renderIQ();
    }

    function renderIQ() {
      if (IS.i >= IS.deck.length) return renderIQRes();
      IS.done = false;
      const it = IS.deck[IS.i];
      const T = TOPICS.find(x => x.id === it.g);

      $("v-quiz").innerHTML = '<div class="qhead">' +
        '<button type="button" class="x" id="qx" aria-label="Sair">✕</button>' +
        '<div class="prog">' +
          '<div class="qmeta"><span>Desafio ' + (IS.i + 1) + ' de ' + IS.deck.length + '</span><span>✅ ' + IS.ok + ' &nbsp;❌ ' + IS.bad + '</span></div>' +
          '<div class="bar"><i style="width:' + Math.round(IS.i / IS.deck.length * 100) + '%"></i></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<span class="pill">' + T.e + ' ' + esc(T.s) + '</span>' +
        renderAtlasImage(it.img, T.s, true) +
        '<div class="qtext" style="margin-top:12px">' + esc(it.q) + '</div>' +
        '<input id="iqa" class="in" placeholder="Escreva sua resposta..." autocomplete="off" autocapitalize="off" spellcheck="false">' +
        '<div class="warnmsg hidden" id="iqw">Digite uma resposta ou toque em “Não sei”.</div>' +
        '<div class="hint hidden" id="iqh" style="margin:8px 2px 0"></div>' +
        '<div class="two">' +
          '<button type="button" class="btn" id="iqc">Verificar</button>' +
          '<button type="button" class="btn soft" id="iqd">💡 Dica</button>' +
        '</div>' +
        '<button type="button" class="link" id="iqs">Não sei / mostrar resposta</button>' +
        '<div id="fb"></div>' +
      '</div>';

      $("qx").onclick = () => askConfirm("Sair do treino?", "Seu progresso nesta rodada será encerrado.", renderQuizHome);
      $("iqc").onclick = () => checkIQ(false);
      $("iqs").onclick = () => checkIQ(true);
      $("iqd").onclick = () => {
        const words = it.name.split(" ").length;
        const letters = it.name.replace(/[^A-Za-zÀ-ÿ]/g, "").length;
        $("iqh").textContent = "Dica: começa com “" + it.name[0].toUpperCase() + "”, tem " + letters + " letras" + (words > 1 ? " e " + words + " palavras." : ".");
        $("iqh").classList.remove("hidden");
      };
      $("iqa").onkeydown = e => {
        if (e.key === "Enter") { e.preventDefault(); checkIQ(false); }
      };
      setTimeout(() => {
        try { $("iqa").focus({ preventScroll: true }); } catch (e) {}
      }, 60);
    }

    function checkIQ(skip) {
      if (IS.done) return;
      const typed = $("iqa").value.trim();
      const it = IS.deck[IS.i];
      if (!skip && !typed) {
        $("iqw").classList.remove("hidden");
        $("iqa").focus();
        return;
      }
      IS.done = true;
      $("iqw").classList.add("hidden");
      const n = normA(typed);
      const ok = !skip && n.length > 0 && distAns(n, [it.name].concat(it.ans)) <= 1;

      if (ok) IS.ok++;
      else { IS.bad++; IS.miss.push(it); }

      $("iqa").disabled = true;
      $("iqa").classList.add(ok ? "okin" : "badin");
      $("iqc").classList.add("hidden");
      $("iqd").classList.add("hidden");
      $("iqs").classList.add("hidden");

      const isLast = IS.i + 1 >= IS.deck.length;
      $("fb").innerHTML = '<div class="fb ' + (ok ? "ok" : "bad") + '">' +
        '<div class="fbh"><span class="fbi">' + (ok ? "✓" : "✕") + '</span><div><small>' + (ok ? "Correto!" : "Resposta esperada") + '</small><b>' + esc(it.name) + '</b></div></div>' +
        (!ok && !skip ? '<div style="font-size:13px;color:var(--muted);margin:-2px 0 8px">Você digitou: <s style="color:var(--err);font-weight:700">' + esc(typed) + '</s></div>' : '') +
        '<div class="tip"><small>Explicação</small>' + esc(it.x) + '</div>' +
        '<button type="button" class="btn dark" id="inx">' + (isLast ? "Ver resultado" : "Próximo desafio →") + '</button>' +
      '</div>';

      $("inx").onclick = () => { IS.i++; renderIQ(); };
    }

    function renderIQRes() {
      const total = IS.ok + IS.bad;
      const acc = total ? Math.round(IS.ok / total * 100) : 0;
      $("v-quiz").innerHTML = '<div class="card result">' +
        '<div class="trophy">' + (acc >= 85 ? "🏆" : acc >= 65 ? "🎉" : "💪") + '</div>' +
        '<h2>Resultado – Identificação com Imagem</h2>' +
        '<p>' + (acc >= 70 ? "Ótima precisão na identificação anatômica!" : "Continue treinando os termos abaixo.") + '</p>' +
        '<div class="rs">' +
          '<div style="background:var(--ok-soft);color:var(--ok)"><b>' + IS.ok + '</b><span>Acertos</span></div>' +
          '<div style="background:var(--err-soft);color:var(--err)"><b>' + IS.bad + '</b><span>Erros</span></div>' +
          '<div style="background:var(--bg)"><b>' + acc + '%</b><span>Aproveit.</span></div>' +
        '</div>' +
        (IS.miss.length ? (
          '<h2 class="sec" style="text-align:center">Itens para rever</h2>' +
          '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">' +
            IS.miss.map(m => '<span class="tag" style="background:var(--err-soft);color:var(--err)">' + esc(m.name) + '</span>').join("") +
          '</div>'
        ) : '') +
        '<button type="button" class="btn" id="iag">🔄 Jogar de novo</button>' +
        '<button type="button" class="btn soft" id="ihm">Mudar tópico</button>' +
      '</div>';

      $("iag").onclick = startIQ;
      $("ihm").onclick = renderQuizHome;
    }

    /* ==================== INICIALIZAÇÃO ==================== */
    loadMediaCache();
    preloadOfflineImages();
    $("chip").textContent = MUSCLES.length + " músculos";
    renderHome();
  } catch (err) {
    const main = document.getElementById("main");
    if (main) {
      main.innerHTML = '<div class="diag-err"><b>Diagnóstico de Inicialização:</b> ' + String(err && err.message ? err.message : err) + '</div>';
    }
  }
});
</script>
</body>
</html>
